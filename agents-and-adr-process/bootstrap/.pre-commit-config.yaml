# Run `uv run pre-commit install` once in each clone (decision 0001).
# It installs the pre-commit hooks, the commit-msg hook and the pre-push hook. Run it again after
# this file changes.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  # kit:gitleaks-hook
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # /kit
  - repo: local
    hooks:
      # kit:local-hooks
      # Only the files of the commit. The doc test and CI check each file of the repo.
      - id: private-data
        name: private data
        entry: uv run python tools/check_private_data.py --files
        language: system
      # A camera recording or a camera frame in the files of the commit. Golden reference files pass.
      # The hook also prints a reminder for an image. The reminder does not stop the commit.
      - id: camera-media
        name: camera recordings and frames
        entry: uv run python tools/check_camera_media.py
        language: system
        verbose: true
      # A CRLF line end in the index. Each repository uses LF line ends on each system.
      - id: line-ends
        name: LF line ends
        entry: uv run python tools/check_line_ends.py
        language: system
        pass_filenames: false
      # An entry or a table file of a decision log in the commit. The hook names the skill. It does not stop the commit.
      - id: decision-log
        name: decision log reminder
        entry: uv run python tools/check_decision_log.py --staged
        language: system
        pass_filenames: false
        verbose: true
      # An entry ID that a different file has on another branch or worktree.
      - id: decision-log-ids
        name: decision log IDs
        entry: uv run python tools/check_decision_log.py --collisions
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # AI attribution in a commit message. The hook warns. It does not stop the commit.
      - id: ai-attribution
        name: AI attribution
        entry: uv run python tools/check_ai_attribution.py
        language: system
        stages: [commit-msg]
        verbose: true
      # /kit
