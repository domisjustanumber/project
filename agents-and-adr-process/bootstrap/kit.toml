# The values of this repository for the kit tools (decision 0001). This repository owns this file.
# tools/kit_sync.py fills each placeholder of the kit text with a value of [values]. The check tools
# read their tables. Each commented line gives the default. Keep each table, also when it is empty:
# a tool stops when its table is missing, when a key is unknown, or when a value has the wrong type.

[sync]
# adopt = ["AGENTS.md#writing-rules"]  # Only these unit IDs of the kit manifest. Default: all units.
# skip = [".github/workflows/doc-checks.yml"]  # The unit IDs that this repository does not take.
# kit = "../project"  # The path of the freemocap/project checkout.

[values]
DEFAULT_BRANCH_TEXT = "`main`"  # The branch that PRs target, as Markdown text, for example "upstream `development`".
AREAS = "the code, the CI"  # What an agent must not change before it reads the decision log.
NORMATIVE_DOCS = "none"  # The binding documents, for example "the specs in `specs/`".
SIBLING_PATH = "../other-repo/notes/"  # A path relative to the repository, as an example in AGENTS.md.
SECRET_SCAN_BRANCHES = "[main]"  # The branches of a PR that the secret scan checks.
PYTHON_VERSION = "3.13.18"  # The Python of the doc checks in CI. At least 3.13.
SELF_TEST = "the self-test of the project"  # The self-test, as AGENTS.md and the skills name it, for example "package.certify".
CERTIFY_SPEC = "specs/certify.md"  # The spec that holds the certify check names.
CERTIFY_REPO = "certify"  # The repository of the certify contract report-format.md.
RULES_ENTRY_LINK = "[ADR-0001](decisions/entries/0001-decision-log-agents-md-and-private-data.md)"  # The link from AGENTS.md to the entry of this repository that gives the rules of the log, of plans/ and of private data.

[check_decision_log]
# module_logs = ["server/decisions"]  # The folder of each module log.
# old_log_dirs = []  # A folder where a log was before a move.
# target_branch = "main"  # The branch that PRs target. --new ranks the entry IDs with it.
# index_limit = 14_000  # A PR that raises a limit must add an entry.
# read_path_limit = 220_000
# last_unlimited_entry = 0

[check_private_data]
# allowed_emails = ["contact@example.org"]  # The public contact address of the project.
# [[check_private_data.allowed_lines]]  # A reviewed line: path, line, the SHA-256 of its text, reason.
# path = "ui/credit.tsx"
# line = 1
# sha256 = "<64 hex characters>"
# reason = "upstream author credit"
# allowed_term_urls = ["https://models.example.org/project-models/"]  # Reviewed public addresses that the term check skips.

[check_links]
# doc_paths = ["specs/", "notes/"]  # The docs that the link check covers: a folder ends with /, else a file.
# skipped_folders = ["specs/records/"]  # Folders of frozen copies. Their README.md is still checked.

[check_camera_media]
# golden_paths = ["golden/"]  # The path prefixes of the golden reference files. Default: none.

[check_other_systems]
# exempt_paths = [".github/"]  # The product folders and the CI workflows. They can name systems.
# certify_spec = "specs/certify.md"  # The spec that holds the check names.
# self_test = "the self-test of the project"  # The self-test, in the advice of a refusal line.
# certify_contract = "the certify contract"  # In the refusal line for a new check.
